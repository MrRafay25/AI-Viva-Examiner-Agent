<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Viva & Interview Examiner - BSAI Project</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 800px; width: 100%; background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h1 { text-align: center; color: #38bdf8; margin-top: 0; font-size: 26px; }
        p.sub { text-align: center; color: #94a3b8; margin-top: -10px; font-size: 14px; margin-bottom: 15px; }
        
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .top-nav a { color: #38bdf8; text-decoration: none; font-size: 13px; font-weight: 600; background: #0f172a; padding: 8px 14px; border-radius: 8px; border: 1px solid #334155; transition: 0.2s; }
        .top-nav a:hover { background: #1e3a8a; border-color: #38bdf8; color: white; }
        .mute-btn { background: #0f172a; color: #cbd5e1; border: 1px solid #334155; padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600; }
        .mute-btn:hover { background: #334155; color: white; }

        .card { background: #0f172a; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        label { display: block; margin-bottom: 6px; color: #cbd5e1; font-weight: 600; font-size: 14px; }
        input[type="text"], input[type="file"], textarea { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: white; font-size: 15px; }
        button { padding: 12px 20px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #0284c7; color: white; width: 100%; }
        .btn-primary:hover { background: #0369a1; }
        .btn-mic { background: #ef4444; color: white; flex: 1; }
        .btn-send { background: #10b981; color: white; flex: 1; }
        
        /* Exam HUD & Progress */
        .hud-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; font-weight: bold; }
        .progress-bar-bg { width: 100%; background: #334155; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 15px; }
        .progress-bar-fill { width: 33%; height: 100%; background: #38bdf8; transition: width 0.4s ease; }
        .timer-badge { background: #1e293b; border: 1px solid #475569; padding: 4px 12px; border-radius: 20px; color: #38bdf8; }
        .timer-warning { color: #facc15; border-color: #facc15; }
        .timer-danger { color: #ef4444; border-color: #ef4444; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.4; } }

        /* Recording Live Beacon */
        .rec-beacon { display: none; align-items: center; gap: 8px; font-size: 13px; color: #ef4444; font-weight: bold; margin-bottom: 10px; }
        .rec-dot { width: 10px; height: 10px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 10px #ef4444; animation: pulse-red 1s infinite; }
        @keyframes pulse-red { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.5; } }

        /* Soundwave Visualizer */
        .soundwave { display: none; justify-content: center; align-items: center; gap: 6px; height: 35px; margin-bottom: 15px; }
        .soundwave .bar { width: 6px; height: 8px; background: #38bdf8; border-radius: 3px; animation: wave 1s infinite ease-in-out; }
        .soundwave .bar:nth-child(2) { animation-delay: 0.15s; }
        .soundwave .bar:nth-child(3) { animation-delay: 0.3s; }
        .soundwave .bar:nth-child(4) { animation-delay: 0.45s; }
        .soundwave .bar:nth-child(5) { animation-delay: 0.6s; }
        .soundwave .bar:nth-child(6) { animation-delay: 0.75s; }
        .soundwave .bar:nth-child(7) { animation-delay: 0.9s; }
        @keyframes wave { 0%, 100% { height: 8px; } 50% { height: 32px; background: #818cf8; } }

        .chat-box { height: 300px; overflow-y: auto; padding: 15px; background: #090d16; border-radius: 10px; margin-bottom: 12px; border: 1px solid #334155; }
        .msg { padding: 12px 16px; border-radius: 10px; margin-bottom: 12px; line-height: 1.5; white-space: pre-wrap; font-size: 15px; }
        .msg-ai { background: #1e3a8a; color: #e0f2fe; border-left: 4px solid #38bdf8; }
        .msg-user { background: #064e3b; color: #d1fae5; border-right: 4px solid #10b981; text-align: right; }
        
        .char-counter { text-align: right; font-size: 12px; color: #94a3b8; margin-top: -8px; margin-bottom: 12px; }
        .controls { display: flex; gap: 10px; }
        .status { text-align: center; font-size: 14px; color: #facc15; margin-bottom: 10px; min-height: 20px; }
        #vivaSection { display: none; }
        .finish-actions { display: none; gap: 10px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎓 AI Viva & Interview Examiner</h1>
    <p class="sub">Agentic AI Based Oral Examination System (Urdu + English Support)</p>
    
    <div class="top-nav">
        <a href="/records">📋 View Saved Records / Teacher Dashboard</a>
        <button class="mute-btn" id="muteBtn" onclick="toggleMute()">🔊 Voice: Unmuted</button>
    </div>

    <!-- Student Setup Card -->
    <div class="card" id="setupSection">
        <label>Student Name:</label>
        <input type="text" id="studentName" placeholder="Jaise: Muhammad Rafay" value="Muhammad Rafay" required>

        <label>Roll Number / Class:</label>
        <input type="text" id="rollNo" placeholder="Jaise: BSAI-01" value="BSAI-01" required>

        <label>Upload Notes / Syllabus (PDF):</label>
        <input type="file" id="pdfFile" accept=".pdf">

        <button class="btn-primary" onclick="startViva()">🚀 Start Live Viva</button>
    </div>

    <!-- Active Examination HUD -->
    <div class="card" id="vivaSection">
        <div class="hud-container">
            <span id="questionStep">Question 1 of 3 (33%)</span>
            <span class="timer-badge" id="timerBadge">⏱️ Time: 60s</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>

        <!-- Live Status Indicators -->
        <div class="rec-beacon" id="recBeacon">
            <span class="rec-dot"></span>
            <span>LIVE AUDIO RECORDING ACTIVE (BOLIYE...)</span>
        </div>

        <div class="soundwave" id="soundWave">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <div class="status" id="statusText">Examiner taiyar ho raha hai...</div>
        <div class="chat-box" id="chatBox"></div>

        <textarea id="answerInput" rows="2" placeholder="Mic dabayein aur bolein, ya yahan likhein..." oninput="updateCharCount()"></textarea>
        <div class="char-counter" id="charCounter">Words: 0 | Characters: 0</div>
        
        <div class="controls" id="actionButtons">
            <button class="btn-mic" id="micBtn" onclick="toggleMic()">🎤 Bol Kar Jawab Dein</button>
            <button class="btn-send" id="submitBtn" onclick="submitAnswer()">✅ Jawab Submit Karein</button>
        </div>

        <div class="finish-actions" id="finishActions">
            <button class="btn-primary" style="flex: 2;" onclick="window.print()">🖨️ Print / Save Viva Report PDF</button>
            <button class="btn-primary" style="background: #334155; flex: 1;" onclick="restartViva()">🔄 Retake Viva</button>
        </div>
    </div>
</div>

<script>
    let recognition;
    let isListening = false;
    let isMuted = false;
    let timeLeft = 60;
    let timerInterval = null;
    let currentAudio = null;

    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-PK';

        recognition.onstart = function() {
            isListening = true;
            document.getElementById("micBtn").innerText = "🛑 Recording... (Sun Raha Hoon)";
            document.getElementById("statusText").innerText = "🎤 Mic ON hai, bolein...";
            document.getElementById("recBeacon").style.display = "flex";
            document.getElementById("soundWave").style.display = "flex";
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            const inputBox = document.getElementById("answerInput");
            inputBox.value = (inputBox.value + " " + transcript).trim();
            updateCharCount();
        };

        recognition.onerror = function() {
            document.getElementById("statusText").innerText = "⚠️ Mic me awaz nahi aayi, dobara try ya type karein.";
            stopListeningUI();
        };

        recognition.onend = function() {
            stopListeningUI();
            document.getElementById("statusText").innerText = "Jawab check karein aur Submit dabayein.";
        };
    }

    function stopListeningUI() {
        isListening = false;
        document.getElementById("micBtn").innerText = "🎤 Bol Kar Jawab Dein";
        document.getElementById("recBeacon").style.display = "none";
        document.getElementById("soundWave").style.display = "none";
    }

    function toggleMic() {
        if (!recognition) {
            alert("Mic ke liye Google Chrome browser use karein!");
            return;
        }
        if (isListening) recognition.stop();
        else recognition.start();
    }

    function toggleMute() {
        isMuted = !isMuted;
        const btn = document.getElementById("muteBtn");
        if (isMuted) {
            btn.innerText = "🔇 Voice: Muted";
            btn.style.color = "#ef4444";
            if (currentAudio) currentAudio.pause();
        } else {
            btn.innerText = "🔊 Voice: Unmuted";
            btn.style.color = "#cbd5e1";
        }
    }

    function updateCharCount() {
        const text = document.getElementById("answerInput").value.trim();
        const words = text ? text.split(/\s+/).length : 0;
        const chars = text.length;
        document.getElementById("charCounter").innerText = `Words: ${words} | Characters: ${chars}`;
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 60;
        const timerBadge = document.getElementById("timerBadge");
        timerBadge.className = "timer-badge";
        timerBadge.innerText = `⏱️ Time: ${timeLeft}s`;

        timerInterval = setInterval(() => {
            timeLeft--;
            timerBadge.innerText = `⏱️ Time: ${timeLeft}s`;

            if (timeLeft <= 20 && timeLeft > 10) {
                timerBadge.className = "timer-badge timer-warning";
            } else if (timeLeft <= 10) {
                timerBadge.className = "timer-badge timer-danger";
            }

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById("statusText").innerText = "⏰ Time khatam! Jawab auto-submit ho raha hai...";
                submitAnswer();
            }
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
    }

    function addMessage(text, sender) {
        const chatBox = document.getElementById("chatBox");
        const div = document.createElement("div");
        div.className = "msg " + (sender === "ai" ? "msg-ai" : "msg-user");
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function playAudio(base64Audio, onCompleteCallback) {
        if (!base64Audio || isMuted) {
            if (onCompleteCallback) onCompleteCallback();
            return;
        }
        try {
            currentAudio = new Audio("data:audio/mp3;base64," + base64Audio);
            document.getElementById("statusText").innerText = "🔊 AI Examiner bol raha hai...";
            document.getElementById("soundWave").style.display = "flex";

            currentAudio.onended = () => {
                document.getElementById("soundWave").style.display = "none";
                document.getElementById("statusText").innerText = "🎤 Ab aapki baari! Mic daba kar jawab dein.";
                if (onCompleteCallback) onCompleteCallback();
            };
            currentAudio.play().catch(e => {
                document.getElementById("soundWave").style.display = "none";
                if (onCompleteCallback) onCompleteCallback();
            });
        } catch(e) {
            document.getElementById("soundWave").style.display = "none";
            if (onCompleteCallback) onCompleteCallback();
        }
    }

    async function startViva() {
        const name = document.getElementById("studentName").value || "Student";
        const roll = document.getElementById("rollNo").value || "BSAI-01";
        const pdf = document.getElementById("pdfFile").files[0];

        const formData = new FormData();
        formData.append("student_name", name);
        formData.append("roll_no", roll);
        if (pdf) formData.append("pdf_file", pdf);

        document.getElementById("setupSection").style.display = "none";
        document.getElementById("vivaSection").style.display = "block";
        document.getElementById("statusText").innerText = "⏳ PDF parhi ja rahi hai aur pehla sawal ban raha hai...";

        try {
            const res = await fetch("/start_viva", { method: "POST", body: formData });
            const data = await res.json();

            addMessage("🤖 AI Examiner:\n" + data.display_text, "ai");
            playAudio(data.audio, () => startTimer());

        } catch (err) {
            console.error(err);
            addMessage("⚠️ Error: Server se connect nahi ho paya. VS Code Terminal check karein.", "ai");
            document.getElementById("statusText").innerText = "Error aaya hai.";
        }
    }

    async function submitAnswer() {
        stopTimer();
        const inputBox = document.getElementById("answerInput");
        const answer = inputBox.value.trim() || "No verbal response provided.";

        addMessage("👤 Student:\n" + answer, "user");
        inputBox.value = "";
        updateCharCount();
        document.getElementById("statusText").innerText = "🧠 AI aapka jawab check kar raha hai...";

        try {
            const res = await fetch("/submit_answer", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ answer: answer })
            });
            const data = await res.json();

            const progress = document.getElementById("progressBar");
            const stepLabel = document.getElementById("questionStep");

            if (data.q_num === 2) {
                progress.style.width = "66%";
                stepLabel.innerText = "Question 2 of 3 (66%)";
            } else if (data.q_num === 3 && !data.is_finished) {
                progress.style.width = "100%";
                stepLabel.innerText = "Question 3 of 3 (Final Question - 100%)";
            }

            addMessage("🤖 AI Examiner:\n" + data.display_text, "ai");

            if (data.is_finished) {
                progress.style.width = "100%";
                stepLabel.innerText = "Viva Completed (100%)";
                document.getElementById("timerBadge").style.display = "none";
                document.getElementById("actionButtons").style.display = "none";
                document.getElementById("answerInput").style.display = "none";
                document.getElementById("charCounter").style.display = "none";
                document.getElementById("finishActions").style.display = "flex";
                document.getElementById("statusText").innerText = "🎉 Viva Mukammal! Report Card taiyar hai.";
                playAudio(data.audio);
            } else {
                playAudio(data.audio, () => startTimer());
            }

        } catch (err) {
            console.error(err);
            addMessage("⚠️ Error: Jawab submit nahi hua.", "ai");
        }
    }

    function restartViva() {
        stopTimer();
        if (currentAudio) currentAudio.pause();
        document.getElementById("chatBox").innerHTML = "";
        document.getElementById("answerInput").value = "";
        document.getElementById("progressBar").style.width = "33%";
        document.getElementById("questionStep").innerText = "Question 1 of 3 (33%)";
        document.getElementById("timerBadge").style.display = "inline-block";
        document.getElementById("actionButtons").style.display = "flex";
        document.getElementById("answerInput").style.display = "block";
        document.getElementById("charCounter").style.display = "block";
        document.getElementById("finishActions").style.display = "none";
        document.getElementById("vivaSection").style.display = "none";
        document.getElementById("setupSection").style.display = "block";
    }
</script>

</body>
</html>
